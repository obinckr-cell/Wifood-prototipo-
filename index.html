<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercadito · Compra y vende cerca de ti</title>
<meta name="theme-color" content="#0f7a4a">
<meta name="description" content="Publica lo que vendes y encuentra lo que te interesa cerca de ti.">
<style>
:root{--brand:#0f7a4a;--brandT:#0f7a4a;--brand2:#e9f5ee;--onbrand:#fff;--accent:#f2a93b;--onaccent:#3b2600;--bg:#f5f3ee;--card:#fff;--field:#efede7;--ink:#1d2420;--mute:#6b746f;--line:rgba(0,0,0,.07);--skel:#e9e7e1;--red:#c2413a;--warnBg:#fff3df;--warnInk:#6b4a0e;--errBg:#fdecea;--errInk:#7a2018;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 18px -6px rgba(0,0,0,.12);--shp:0 1px 1px rgba(0,0,0,.04),0 3px 6px -2px rgba(0,0,0,.08),0 14px 28px -10px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7);--shn:0 -6px 20px -8px rgba(0,0,0,.18);--r:18px}
*{margin:0;padding:0;box-sizing:border-box}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--fondoImg,none);pointer-events:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:86px;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin:auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 8px 16px -14px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--brandT);min-width:0;display:flex;align-items:center;gap:7px}
.logo i{font-style:normal;background:var(--brand);color:var(--onbrand);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;font-size:17px;flex:none;overflow:hidden;box-shadow:0 3px 8px -3px rgba(0,0,0,.35)}
.logo i.img{background:none}.logo i.img img{width:100%;height:100%;object-fit:contain}
.ico{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:17px;flex:none}
.sw{width:36px;height:36px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 2px 5px rgba(0,0,0,.2)}.sw.on{outline:3px solid var(--ink);outline-offset:3px}
.mlogo{width:84px;height:84px;border-radius:18px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-size:40px;overflow:hidden;flex:none;box-shadow:var(--sh)}.mlogo img{width:100%;height:100%;object-fit:contain;background:#fff}.row>.mlogo,.row>.ico{flex:none}
.grow{flex:1}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--brand2);display:grid;place-items:center;font-weight:700;color:var(--brandT);flex:none;overflow:hidden;border:0;box-shadow:var(--sh)}
.av img{width:100%;height:100%;object-fit:cover}
.search{display:flex;gap:8px;padding-bottom:10px}
.search input{flex:1;min-width:0;border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:12px 18px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 6px -2px rgba(0,0,0,.12);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
h2.sec{font-size:18px;margin:18px 0 12px;display:flex;align-items:baseline;gap:8px;letter-spacing:-.2px}
h2.sec small{font-weight:400;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.post{background:var(--card);border-radius:var(--r);overflow:hidden;border:0;text-align:left;padding:6px;display:flex;flex-direction:column;box-shadow:var(--shp);transition:transform .15s,box-shadow .15s}
.post:active{transform:translateY(2px) scale(.985);box-shadow:var(--sh)}
.post .ph{aspect-ratio:1;background:var(--skel);position:relative;border-radius:calc(var(--r) - 5px);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.post .ph img{width:100%;height:100%;object-fit:cover;display:block}
.post .price{display:inline-block;background:var(--brand);color:var(--onbrand);font-weight:800;font-size:14px;border-radius:9px;padding:4px 9px;margin-bottom:6px;box-shadow:0 3px 8px -3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.post .tag{position:absolute;left:8px;top:8px;z-index:1;background:var(--accent);color:var(--onaccent);font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px;box-shadow:0 3px 8px -2px rgba(0,0,0,.35)}
.post .sold{position:absolute;inset:0;z-index:2;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:1px}
.post .in{padding:9px 6px 6px}
.post .ti{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .ci{font-size:12px;color:var(--mute);margin-top:5px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;line-height:1.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);box-shadow:var(--shn);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mute);padding:4px 2px;flex:1;min-width:0;position:relative;white-space:nowrap}
nav.tabs button b{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brandT);font-weight:700}
nav.tabs .pub b{background:var(--brand);color:var(--onbrand);border-radius:13px;width:46px;height:34px;display:grid;place-items:center;font-size:24px;box-shadow:0 5px 12px -4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.badge{position:absolute;top:0;left:50%;margin-left:6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--card)}
.btn{border:0;background:var(--brand);color:var(--onbrand);border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.btn.red{background:var(--errBg);color:var(--errInk);box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:0;border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:var(--sh)}
.card.adm{background:var(--errBg)}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.in-f{width:100%;border:0;background:var(--field);border-radius:12px;padding:13px;font-size:15px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.in-f:focus{outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.08),0 0 0 2px var(--brand)}
textarea.in-f{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.err{color:var(--red);font-size:14px;margin-top:10px}
.ok{color:var(--brandT);font-size:14px;margin-top:10px}
.auth{max-width:420px;margin:30px auto;padding:0 16px}
.auth h1{font-size:28px;letter-spacing:-.5px;margin-bottom:4px}
.auth p.sub{color:var(--mute);margin-bottom:18px;line-height:1.45}
.link{background:none;border:0;color:var(--brandT);font-weight:700;padding:6px 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:12px;line-height:1.4}
.chk input{margin-top:2px;width:18px;height:18px;flex:none;accent-color:var(--brand)}
.pick{display:flex;flex-wrap:wrap;gap:9px}
.pick .chip{font-size:14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{width:86px;height:86px;border-radius:12px;overflow:hidden;position:relative;background:var(--skel);box-shadow:var(--sh)}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
.photos .add{width:86px;height:86px;border-radius:12px;border:0;background:var(--field);box-shadow:inset 0 1px 3px rgba(0,0,0,.1);font-size:28px;color:var(--mute)}
.det .galw{position:relative;margin-top:12px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shp);background:var(--skel)}
.det .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.det .gal::-webkit-scrollbar{display:none}
.det .gal img{width:100%;flex:none;aspect-ratio:1;max-height:56vh;object-fit:cover;scroll-snap-align:center}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.4)}.dots i.on{background:#fff;width:18px;border-radius:4px}
.det h1{font-size:23px;margin-top:16px;line-height:1.25;letter-spacing:-.3px}
.det .pr{display:inline-block;font-size:24px;font-weight:800;color:var(--onbrand);background:var(--brand);border-radius:12px;padding:6px 12px;margin-top:8px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.det .meta{color:var(--mute);font-size:13px;margin-top:8px}
.det .desc{line-height:1.55;white-space:pre-wrap}
.seller{display:flex;gap:12px;align-items:center;background:none;border:0;text-align:left;width:100%}
.seller .av{width:48px;height:48px;font-size:18px}
.seller b{display:block}
.seller small{color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.back{background:none;border:0;font-size:15px;color:var(--mute);padding:12px 0 0}
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px}
.prof h1{font-size:21px}
.prof p{color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}
#toast.show{opacity:1}
.banner{background:var(--warnBg);color:var(--warnInk);border-radius:14px;padding:11px 13px;font-size:13px;margin-top:12px;line-height:1.4}
.banner.err{background:var(--errBg);color:var(--errInk)}
.banner .link{color:inherit;text-decoration:underline}
.legal{font-size:13px;color:var(--mute);line-height:1.55}
.legal h3{color:var(--ink);font-size:15px;margin:12px 0 4px}
.spin{width:28px;height:28px;border:3px solid var(--field);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* mensajes */
.conv{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:0;border-radius:var(--r);padding:10px;margin:10px 0;text-align:left;box-shadow:var(--sh)}
.conv .mi{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--skel)}
.conv .tx{flex:1;min-width:0}
.conv .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .tx small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .tx .pp{font-size:12px;color:var(--brandT);font-weight:700}
.conv .hr{font-size:11px;color:var(--mute);text-align:right;flex:none}
.conv .nl{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--brand);margin-top:6px;box-shadow:0 0 0 3px var(--brand2)}
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh;margin-bottom:-86px}
.chat .hd{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);box-shadow:0 8px 16px -12px rgba(0,0,0,.35);z-index:2}
.chat .hd img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--skel)}
.chat .hd .tx{flex:1;min-width:0}.chat .hd b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat .hd small{color:var(--mute);font-size:12px}
.chat .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:9px 12px;border-radius:16px;line-height:1.4;font-size:15px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 2px 6px -2px rgba(0,0,0,.18)}
.bub small{display:block;font-size:10px;opacity:.7;margin-top:3px;text-align:right}
.bub.yo{align-self:flex-end;background:var(--brand);color:var(--onbrand);border-bottom-right-radius:5px}
.bub.el{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.chat .nota{text-align:center;color:var(--mute);font-size:13px;margin:auto 20px;line-height:1.5}
.chat .bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);box-shadow:var(--shn)}
.chat .bar textarea{flex:1;border:0;background:var(--field);border-radius:20px;padding:11px 15px;font-size:15px;resize:none;max-height:120px;min-height:44px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.chat .bar button{width:46px;height:46px;border-radius:50%;border:0;background:var(--brand);color:var(--onbrand);font-size:19px;flex:none;align-self:flex-end;box-shadow:0 5px 12px -4px rgba(0,0,0,.45)}
.fav{position:absolute;right:8px;top:8px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px)}
.fav.on,.favb.on{color:#ff4d6d}
.post.dest{box-shadow:0 0 0 2px var(--accent),var(--shp)}
.link.mini{font-size:13px;margin-left:auto;padding:0}
.stars{display:inline-flex;gap:1px;vertical-align:-2px;color:var(--accent)}
.rate{display:block;margin-top:3px;font-size:13px}.rate b{display:inline;font-size:13px}.rate small{display:inline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:16px}
.modal.visor img{max-width:100%;max-height:90vh;border-radius:12px}
.pick.big{justify-content:center;gap:6px}.sb{background:none;border:0;color:inherit;padding:2px}
.hb{background:var(--field);border:0;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--ink);flex:none;display:grid;place-items:center}
.chat .bar .clip{background:var(--field);color:var(--ink);box-shadow:none}
.bub.ft{padding:4px 4px 6px}.bub.ft small{padding:0 8px}
.bimg{display:block;max-width:230px;max-height:260px;width:100%;object-fit:cover;border-radius:12px;margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.tile{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.tile b{display:block;font-size:28px;letter-spacing:-.5px;color:var(--brandT)}.tile span{display:block;font-size:13px;font-weight:600;margin-top:2px}.tile small{display:block;font-size:11.5px;color:var(--mute);margin-top:4px}
nav.tabs button b svg{display:block}nav.tabs .pub b svg{display:none}
#btema svg{display:block}
.adgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.adbtn{background:var(--card);border:0;border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;min-height:84px}
.adbtn b{font-size:15px}.adbtn small{font-size:12px;color:var(--mute);line-height:1.35}
.arow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px 10px;margin:8px 0;box-shadow:var(--sh)}
.arow img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--skel)}
.arow .tx{flex:1;min-width:0}.arow .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arow .tx small{display:block;font-size:12px;color:var(--mute)}.arow .tx .est{color:var(--brandT);font-weight:700}
.arow input[type=checkbox],.swr input{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.arow .in-f{flex:1;min-width:0;padding:10px}
.apbar{position:fixed;left:10px;right:10px;bottom:90px;z-index:40;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);max-width:700px;margin:auto}
.apbar .hb{background:rgba(255,255,255,.14);color:inherit}
.swr{display:flex;gap:12px;align-items:center;justify-content:space-between}.swr span{flex:1}.swr b{display:block}.swr small{display:block;color:var(--mute);font-size:13px;margin-top:2px;line-height:1.4}
.hb:disabled{opacity:.35}
.tipo{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:4px;background:var(--field);color:var(--ink)}
.t-regen{background:#16a34a;color:#fff}.t-conv{background:#a16207;color:#fff}.t-transp{background:#0369a1;color:#fff}.t-comer{background:#7c3aed;color:#fff}.t-resto{background:#db2777;color:#fff}.t-consu{background:#475569;color:#fff}.t-asesor{background:#0f766e;color:#fff}.t-mentor{background:var(--accent);color:var(--onaccent)}
.actor{display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--card);border:0;border-radius:var(--r);padding:12px;margin:10px 0;text-align:left;box-shadow:var(--sh)}
.actor .av{width:52px;height:52px;font-size:20px}.actor .tx{flex:1;min-width:0}.actor .tx b{display:block}.actor .tx small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}.actor .tx .prod{color:var(--ink)}
.composer{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:0;border-radius:var(--r);padding:12px 14px;margin:14px 0 4px;box-shadow:var(--sh);text-align:left;color:var(--mute)}
.ipost{background:var(--card);border-radius:var(--r);margin:14px 0;box-shadow:var(--shp);overflow:hidden}
.ihead{padding:12px 14px 0}.ihead .av{width:42px;height:42px}.ihead small{color:var(--mute);font-size:12px}
.itext{padding:10px 14px 0;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.imedia{position:relative;margin-top:10px;background:var(--skel);cursor:pointer;min-height:120px}.imedia img{width:100%;max-height:70vh;object-fit:cover;display:block}
.imedia .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.imedia.vid{aspect-ratio:16/9;cursor:auto}.imedia.vid iframe{width:100%;height:100%;border:0;display:block}
.nfot{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 9px}
.ifotos{display:grid;gap:4px;margin-top:10px}.ifotos img{width:100%;display:block;cursor:zoom-in}
.fcard{display:flex;gap:12px;align-items:center;width:calc(100% - 28px);margin:10px 14px 0;background:var(--field);border:0;border-radius:14px;padding:12px;text-align:left;color:var(--ink);text-decoration:none}
.fcard .fi{width:46px;height:46px;border-radius:10px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;flex:none;overflow:hidden}.fcard .tx{flex:1;min-width:0}.fcard b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.fcard small{color:var(--mute);font-size:12px}
.card .fcard{width:100%;margin:0}
.iacts{display:flex;gap:6px;padding:8px 8px 10px;align-items:center}
.ia{background:none;border:0;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:999px;color:var(--mute);font-weight:700;font-size:14px}.ia.on{color:#ff4d6d}

const PAG=24;let FEED_T=0,FEED_FIN=false,FEED_CUR=null,DESTACADOS=[],ALERTAS=[],EXTRA={},FIL={min:"",max:"",ciudad:"",orden:"rel"},FILTROS_ABIERTOS=false;

async function cargarFeed(mas){

/* Puntaje de interés: lo que marcó en su perfil, lo que ha buscado y mirado, su ciudad y qué tan nueva es */
function puntaje(p){
  if(!PERFIL)return 0;
  let s=0;const w=new Set(p.palabras||[]),ints=PERFIL.intereses||[],g=PERFIL.gustos||{};
  ints.forEach(i=>{if(i.startsWith("cat:")){if(p.cat===i.slice(4))s+=4}else palabras(i).forEach(x=>{if(w.has(x))s+=6})});
  Object.keys(g).forEach(k=>{if(k.startsWith("cat:")){if(p.cat===k.slice(4))s+=Math.min(3,g[k]*.5)}else if(w.has(k))s+=Math.min(4,g[k])});
  if(PERFIL.ciudad&&norm(p.ciudad)===norm(PERFIL.ciudad))s+=2;
  const dias=(Date.now()-(p.creado||0))/864e5;s+=Math.max(0,2-dias/7);
  if(p.vendido)s-=5;if(p.uid===ME.uid)s-=3;
  return s;
}

/* archivos grandes: se guardan por partes de 600 KB en Firestore */
function b64(buf){let s="";const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)}
async function subirArchivo(file,prog){
  const buf=await file.arrayBuffer(),n=Math.ceil(buf.byteLength/PARTE),ref=DB.collection("archivos").doc();
  for(let i=0;i<n;i++){await ref.collection("p").doc(String(i)).set({d:b64(buf.slice(i*PARTE,(i+1)*PARTE))});prog&&prog((i+1)/n)}
  const meta={nombre:file.name||"archivo",mime:file.type||"application/octet-stream",tam:buf.byteLength,partes:n,por:ME.uid,creado:Date.now()};
  await ref.set(meta);return Object.assign({id:ref.id},meta);
}
async function bajarArchivo(id,prog){
  if(ARCH[id])return ARCH[id];
  const m=await DB.collection("archivos").doc(id).get();if(!m.exists)throw new Error("El archivo ya no existe");const meta=m.data(),partes=[];
  for(let i=0;i<meta.partes;i++){const d=await DB.collection("archivos").doc(id).collection("p").doc(String(i)).get();const s=atob(d.data().d),u=new Uint8Array(s.length);for(let k=0;k<s.length;k++)u[k]=s.charCodeAt(k);partes.push(u);prog&&prog((i+1)/meta.partes)}
  ARCH[id]={meta,url:URL.createObjectURL(new Blob(partes,{type:meta.mime}))};return ARCH[id];
}

  }catch(e){w.remove();toast(errTxt(e))}

/* ---------- estadísticas (admin) ---------- */
function barras(titulo,datos,nota){
  const W=360,H=170,izq=28,abajo=24,max=Math.max(1,...datos.map(d=>d.n)),paso=Math.max(1,Math.ceil(max/4)),top=paso*Math.ceil(max/paso),bw=(W-izq-10)/datos.length;
  const y=v=>H-abajo-(v/top)*(H-abajo-14);let g="";
  for(let v=0;v<=top;v+=paso)g+=`<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--mute)" stroke-opacity=".18"/><text x="${izq-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--mute)">${v}</text>`;
  const b=datos.map((d,i)=>{const x=izq+i*bw+3,h=y(0)-y(d.n);return `<g><rect x="${x}" y="${y(d.n)}" width="${bw-6}" height="${Math.max(h,0)}" rx="4" fill="var(--brand)"><title>${d.etq}: ${d.n}</title></rect>${(datos.length-1-i)%3?"":`<text x="${x+(bw-6)/2}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="var(--mute)">${d.etq}</text>`}</g>`}).join("");
  return `<div class="card"><b>${titulo}</b>${nota?`<p class="legal">${nota}</p>`:""}<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px" role="img" aria-label="${titulo}">${g}${b}</svg></div>`;
}

  ${barras("Usuarios nuevos por día",porDia(U),"Últimos 14 días")}${barras("Publicaciones nuevas por día",porDia(P),"Últimos 14 días")}<p class="legal" style="margin-bottom:24px">Cada vez que abres esta pantalla se leen los registros de los últimos 30 días, así que gasta lecturas del cupo gratis: ábrela cuando la necesites.</p>`;
}

function achicarLogo(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let d=c.toDataURL("image/png");if(d.length>180000)d=c.toDataURL("image/webp",.85);if(d.length>180000||!/^data:image\/webp/.test(d)&&d.length>180000)d=c.toDataURL("image/jpeg",.8);ok(d)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("No se pudo leer la imagen"))};im.src=u})}

async function publicar(){
  const b=BORRADOR,er=$("#per");er.textContent="";
  b.titulo=$("#ti").value.trim();b.precio=Math.round(+$("#pr").value||0);b.ciudad=$("#ciu").value.trim();b.desc=$("#de").value.trim();
  if(!b.fotos.length){er.textContent="Agrega al menos una foto.";return}
  if(b.titulo.length<3){er.textContent="Escribe qué vendes.";return}
  if(!b.cat){er.textContent="Elige una categoría.";return}
  const mala=prohibida(b.titulo+" "+b.desc);if(mala&&!ADMIN){er.textContent="Tu publicación tiene una palabra que no está permitida: «"+mala+"».";return}
  if(!b.id&&AJ.limite>0&&!ADMIN){try{const n=(await DB.collection("publicaciones").where("uid","==",ME.uid).get()).docs.filter(d=>!d.data().vendido).length;if(n>=AJ.limite){er.textContent="Puedes tener máximo "+AJ.limite+" publicaciones activas. Marca alguna como vendida o bórrala.";return}}catch(e){}}
  $("#pub").disabled=true;
  try{
    const mini=await achicarDataURL(b.fotos[0],320,.7);
    const due=b.uid||ME.uid;
    const datos={uid:due,vNombre:b.uid&&b.uid!==ME.uid?(b.vNombre||""):PERFIL.nombre,titulo:b.titulo,precio:b.precio,cat:b.cat,ciudad:b.ciudad,desc:b.desc,mini,palabras:palabras(b.titulo+" "+b.desc+" "+catN(b.cat)[2]).slice(0,40)};
    let id=b.id;
    if(id){await DB.collection("publicaciones").doc(id).update(Object.assign(datos,{editado:Date.now()}))}
    else{datos.creado=Date.now();datos.vendido=false;const r=await DB.collection("publicaciones").add(datos);id=r.id}
    await DB.collection("fotos").doc(id).set({uid:due,imgs:b.fotos});
    FEED=[];toast(b.id?"Cambios guardados":"¡Publicado!");BORRADOR=null;ir("post",id);

function achicarDataURL(src,max,q){return new Promise(ok=>{const im=new Image();setTimeout(()=>ok(src),4000);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");if(!x){ok(src);return}x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.onerror=()=>ok(src);im.src=src})}
