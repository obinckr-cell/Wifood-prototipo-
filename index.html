<!DOCTYPE html>

<head>

<title>Mercadito · Compra y vende cerca de ti</title>
<meta name="theme-color" content="#0f7a4a">
<meta name="description" content="Publica lo que vendes y encuentra lo que te interesa cerca de ti.">
<style>
:root{--brand:#0f7a4a;--brandT:#0f7a4a;--brand2:#e9f5ee;--onbrand:#fff;--accent:#f2a93b;--onaccent:#3b2600;--bg:#f5f3ee;--card:#fff;--field:#efede7;--ink:#1d2420;--mute:#6b746f;--line:rgba(0,0,0,.07);--skel:#e9e7e1;--red:#c2413a;--warnBg:#fff3df;--warnInk:#6b4a0e;--errBg:#fdecea;--errInk:#7a2018;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 18px -6px rgba(0,0,0,.12);--shp:0 1px 1px rgba(0,0,0,.04),0 3px 6px -2px rgba(0,0,0,.08),0 14px 28px -10px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7);--shn:0 -6px 20px -8px rgba(0,0,0,.18);--r:18px}
*{margin:0;padding:0;box-sizing:border-box}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--fondoImg,none);pointer-events:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:86px;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin:auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 8px 16px -14px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--brandT);min-width:0;display:flex;align-items:center;gap:7px}
.logo i{font-style:normal;background:var(--brand);color:var(--onbrand);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;font-size:17px;flex:none;overflow:hidden;box-shadow:0 3px 8px -3px rgba(0,0,0,.35)}
.logo i.img{background:none}.logo i.img img{width:100%;height:100%;object-fit:contain}
.ico{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:17px;flex:none}
.sw{width:36px;height:36px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 2px 5px rgba(0,0,0,.2)}.sw.on{outline:3px solid var(--ink);outline-offset:3px}
.mlogo{width:84px;height:84px;border-radius:18px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-size:40px;overflow:hidden;flex:none;box-shadow:var(--sh)}.mlogo img{width:100%;height:100%;object-fit:contain;background:#fff}.row>.mlogo{flex:none}
.grow{flex:1}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--brand2);display:grid;place-items:center;font-weight:700;color:var(--brandT);flex:none;overflow:hidden;border:0;box-shadow:var(--sh)}
.av img{width:100%;height:100%;object-fit:cover}
.search{display:flex;gap:8px;padding-bottom:10px}
.search input{flex:1;min-width:0;border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:12px 18px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 6px -2px rgba(0,0,0,.12);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
h2.sec{font-size:18px;margin:18px 0 12px;display:flex;align-items:baseline;gap:8px;letter-spacing:-.2px}
h2.sec small{font-weight:400;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.post{background:var(--card);border-radius:var(--r);overflow:hidden;border:0;text-align:left;padding:6px;display:flex;flex-direction:column;box-shadow:var(--shp);transition:transform .15s,box-shadow .15s}
.post:active{transform:translateY(2px) scale(.985);box-shadow:var(--sh)}
.post .ph{aspect-ratio:1;background:var(--skel);position:relative;border-radius:calc(var(--r) - 5px);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.post .ph img{width:100%;height:100%;object-fit:cover;display:block}
.post .ph::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.35));pointer-events:none}
.post .price{position:absolute;left:8px;bottom:8px;z-index:1;background:var(--brand);color:var(--onbrand);font-weight:800;font-size:14px;border-radius:10px;padding:5px 9px;box-shadow:0 4px 10px -3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.post .tag{position:absolute;left:8px;top:8px;z-index:1;background:var(--accent);color:var(--onaccent);font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px;box-shadow:0 3px 8px -2px rgba(0,0,0,.35)}
.post .sold{position:absolute;inset:0;z-index:2;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:1px}
.post .in{padding:9px 6px 6px}
.post .ti{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .ci{font-size:12px;color:var(--mute);margin-top:5px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;line-height:1.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);box-shadow:var(--shn);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mute);padding:4px 2px;flex:1;min-width:0;position:relative;white-space:nowrap}
nav.tabs button b{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brandT);font-weight:700}
nav.tabs .pub b{background:var(--brand);color:var(--onbrand);border-radius:13px;width:46px;height:34px;display:grid;place-items:center;font-size:24px;box-shadow:0 5px 12px -4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.badge{position:absolute;top:0;left:50%;margin-left:6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--card)}
.btn{border:0;background:var(--brand);color:var(--onbrand);border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.btn.red{background:var(--errBg);color:var(--errInk);box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:0;border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:var(--sh)}
.card.adm{background:var(--errBg)}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.in-f{width:100%;border:0;background:var(--field);border-radius:12px;padding:13px;font-size:15px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.in-f:focus{outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.08),0 0 0 2px var(--brand)}
textarea.in-f{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.err{color:var(--red);font-size:14px;margin-top:10px}
.ok{color:var(--brandT);font-size:14px;margin-top:10px}
.auth{max-width:420px;margin:30px auto;padding:0 16px}
.auth h1{font-size:28px;letter-spacing:-.5px;margin-bottom:4px}
.auth p.sub{color:var(--mute);margin-bottom:18px;line-height:1.45}
.link{background:none;border:0;color:var(--brandT);font-weight:700;padding:6px 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:12px;line-height:1.4}
.chk input{margin-top:2px;width:18px;height:18px;flex:none;accent-color:var(--brand)}
.pick{display:flex;flex-wrap:wrap;gap:9px}
.pick .chip{font-size:14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{width:86px;height:86px;border-radius:12px;overflow:hidden;position:relative;background:var(--skel);box-shadow:var(--sh)}
.photos .p img{width:100%;height:100%;object-fit:cover}

.det .galw{position:relative;margin-top:12px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shp);background:var(--skel)}
.det .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.det .gal::-webkit-scrollbar{display:none}

.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}

.det .desc{line-height:1.55;white-space:pre-wrap}
.seller{display:flex;gap:12px;align-items:center;background:none;border:0;text-align:left;width:100%}
.seller .av{width:48px;height:48px;font-size:18px}
.seller b{display:block}
.seller small{color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.back{background:none;border:0;font-size:15px;color:var(--mute);padding:12px 0 0}
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px}
.prof h1{font-size:21px}
.prof p{color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}
#toast.show{opacity:1}
.banner{background:var(--warnBg);color:var(--warnInk);border-radius:14px;padding:11px 13px;font-size:13px;margin-top:12px;line-height:1.4}
.banner.err{background:var(--errBg);color:var(--errInk)}
.banner .link{color:inherit;text-decoration:underline}
.legal{font-size:13px;color:var(--mute);line-height:1.55}
.legal h3{color:var(--ink);font-size:15px;margin:12px 0 4px}
.spin{width:28px;height:28px;border:3px solid var(--field);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* mensajes */
.conv{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:0;border-radius:var(--r);padding:10px;margin:10px 0;text-align:left;box-shadow:var(--sh)}
.conv .mi{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--skel)}
.conv .tx{flex:1;min-width:0}
.conv .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .tx small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .tx .pp{font-size:12px;color:var(--brandT);font-weight:700}
.conv .hr{font-size:11px;color:var(--mute);text-align:right;flex:none}
.conv .nl{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--brand);margin-top:6px;box-shadow:0 0 0 3px var(--brand2)}
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh;margin-bottom:-86px}
.chat .hd{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);box-shadow:0 8px 16px -12px rgba(0,0,0,.35);z-index:2}
.chat .hd img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--skel)}
.chat .hd .tx{flex:1;min-width:0}.chat .hd b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat .hd small{color:var(--mute);font-size:12px}
.chat .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:9px 12px;border-radius:16px;line-height:1.4;font-size:15px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 2px 6px -2px rgba(0,0,0,.18)}
.bub small{display:block;font-size:10px;opacity:.7;margin-top:3px;text-align:right}
.bub.yo{align-self:flex-end;background:var(--brand);color:var(--onbrand);border-bottom-right-radius:5px}
.bub.el{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.chat .nota{text-align:center;color:var(--mute);font-size:13px;margin:auto 20px;line-height:1.5}
.chat .bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);box-shadow:var(--shn)}

.chat .bar button{width:46px;height:46px;border-radius:50%;border:0;background:var(--brand);color:var(--onbrand);font-size:19px;flex:none;align-self:flex-end;box-shadow:0 5px 12px -4px rgba(0,0,0,.45)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  </div></div>`;

async function cargarFeed(){
  const q=await DB.collection("publicaciones").orderBy("creado","desc").limit(120).get();
  FEED=q.docs.map(d=>Object.assign({id:d.id},d.data())).filter(p=>ADMIN||visible(p));

/* Puntaje de interés: lo que marcó en su perfil, lo que ha buscado y mirado, su ciudad y qué tan nueva es */
function puntaje(p){
  if(!PERFIL)return 0;
  let s=0;const w=new Set(p.palabras||[]),ints=PERFIL.intereses||[],g=PERFIL.gustos||{};
  ints.forEach(i=>{if(i.startsWith("cat:")){if(p.cat===i.slice(4))s+=4}else palabras(i).forEach(x=>{if(w.has(x))s+=6})});
  Object.keys(g).forEach(k=>{if(k.startsWith("cat:")){if(p.cat===k.slice(4))s+=Math.min(3,g[k]*.5)}else if(w.has(k))s+=Math.min(4,g[k])});
  if(PERFIL.ciudad&&norm(p.ciudad)===norm(PERFIL.ciudad))s+=2;
  const dias=(Date.now()-(p.creado||0))/864e5;s+=Math.max(0,2-dias/7);
  if(p.vendido)s-=5;if(p.uid===ME.uid)s-=3;
  return s;
}
/* Aprende de lo que busca y mira (se guarda en su perfil) */
let gustoT=null;
function aprender(cosas){
  if(!PERFIL)return;const g=PERFIL.gustos=PERFIL.gustos||{};
  cosas.forEach(k=>{g[k]=Math.min(20,(g[k]||0)+1)});
  const top=Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,60);PERFIL.gustos=Object.fromEntries(top);
  clearTimeout(gustoT);gustoT=setTimeout(()=>{DB.collection("usuarios").doc(ME.uid).update({gustos:PERFIL.gustos}).catch(()=>{})},1500);
}

}

function pintarInicio(){

  const para=conP.filter(x=>x.s>=4&&!x.p.vendido&&x.p.uid!==ME.uid).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.p);

  if(bloqueado())h+=`<div class="banner err">⛔ Tu cuenta está bloqueada hasta el ${fecha(PERFIL.bloqueadoHasta)}. Mientras tanto no puedes publicar y tus publicaciones están ocultas.</div>`;

async function bloquear(uid,dias){

async function enviarMsg(){
  const t=$("#mtxt"),txt=(t&&t.value||"").trim().slice(0,1000);if(!txt||!CHAT_ID)return;
  const cid=CHAT_ID,now=Date.now();t.value="";t.style.height="";

      const d=Object.assign({},CHAT_DRAFT);delete d.id;d.creado=now;d.ultimo=now;d.ultimoTxt=txt.slice(0,80);d.ultimoPor=ME.uid;d.leido={[ME.uid]:now};

function achicarDataURL(src,max,q){return new Promise(ok=>{const im=new Image();setTimeout(()=>ok(src),4000);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");if(!x){ok(src);return}x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.onerror=()=>ok(src);im.src=src})}

/* ---------- mis ventas ---------- */
async function vistaMias(){
  $("#app").innerHTML=`<header><div class="wrap"><div class="top"><div class="logo grow">Mis ventas</div></div></div></header><div class="wrap" id="cont"><div class="spin"></div></div>`;
  let L=[];try{const q=await DB.collection("publicaciones").where("uid","==",ME.uid).get();L=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.creado-a.creado)}catch(e){$("#cont").innerHTML=`<p class="empty">${esc(errTxt(e))}</p>`;return}
  const act=L.filter(p=>!p.vendido).length;
  $("#cont").innerHTML=L.length?`<h2 class="sec">${act} ${act===1?"activa":"activas"} <small>· ${L.length-act} vendidas</small></h2><div class="grid">${L.map(p=>tarjeta(p)).join("")}</div>`:`<p class="empty">Aún no has publicado nada.</p><p style="text-align:center"><button class="btn" data-go="publicar">+ Vender algo</button></p>`;
}

  <div class="pick" style="margin-top:10px" id="pints">${CATS.map(c=>`<button class="chip${ints.includes("cat:"+c[0])?" on":""}" data-int="cat:${c[0]}" type="button">${c[1]} ${c[2]}</button>`).join("")}</div>

  ${nuevo?"":`<div class="acts" style="margin:24px 0 10px">${ADMIN?`<button class="btn" data-go="admin">🛡️ Panel de administrador</button>`:""}<button class="btn alt" data-a="legal">Términos y datos</button><button class="btn red" data-a="salir">Cerrar sesión</button></div>

    $("#psave").disabled=true;

/* ---------- términos (resumen) ---------- */
function legal(){
  const w=document.createElement("div");w.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:grid;place-items:center;padding:16px";
  w.innerHTML=`<div class="card legal" style="max-width:520px;max-height:85vh;overflow:auto;margin:0"><h2 style="color:var(--ink)">Términos y tratamiento de datos</h2>
  <h3>Qué datos guardamos</h3><p>Tu correo, nombre, foto, ciudad, tus intereses, lo que publicas y los mensajes de tus conversaciones. La contraseña la maneja Google Firebase y nosotros no la vemos.</p>
  <h3>Para qué</h3><p>Para que funcione tu cuenta, mostrar tus publicaciones y mostrarte primero lo que te interesa. Tus mensajes solo los ven tú y la persona con la que hablas.</p>
  <h3>Tus derechos</h3><p>Puedes ver, corregir y borrar tus datos y publicaciones cuando quieras desde tu perfil, o pedir que borremos tu cuenta (Ley 1581 de 2012).</p>
  <h3>Reglas</h3><p>Está prohibido publicar productos ilegales, robados, armas, drogas, medicamentos, animales silvestres o contenido engañoso. ${NOMBRE} solo pone en contacto a compradores y vendedores: el negocio, el pago y la entrega se acuerdan entre ustedes. Encuéntrense en lugares públicos y no paguen por adelantado a desconocidos.</p>
  <button class="btn block" style="margin-top:14px">Entendido</button></div>`;
  w.onclick=e=>{if(e.target===w||e.target.tagName==="BUTTON")w.remove()};document.body.appendChild(w);
}

const A={
  m_entrar(){pantallaEntrar("entrar")},m_registro(){pantallaEntrar("registro")},m_recuperar(){pantallaEntrar("recuperar")},
  legal(){legal()},
  async salir(){await AUTH.signOut();FEED=[];PERFIL=null;VISTA="inicio"},
  atras(){ir(VOLVER||"inicio")},
  async reenviar(){try{await ME.sendEmailVerification();toast("Correo enviado")}catch(e){toast(errTxt(e))}},
  noverif(){sessionStorage.setItem("noVerif","1");pintarInicio()},
  async masfoto(){const f=await elegirFoto();if(!f)return;try{BORRADOR.fotos.push(await achicar(f,900,.72));pintarFotos()}catch(e){toast(errTxt(e))}},
  async pfoto(){const f=await elegirFoto();if(!f)return;try{PF.foto=await achicar(f,240,.75);$("#pfoto").innerHTML=`<img src="${PF.foto}" alt="">`;toast("Toca Guardar para conservar la foto")}catch(e){toast(errTxt(e))}},
  addint(){const v=$("#pnew").value.trim().toLowerCase();if(!v)return;if(!PF.ints.includes(v))PF.ints.push(v);$("#pnew").value="";$("#ppal").innerHTML=PF.ints.filter(i=>!i.startsWith("cat:")).map(i=>`<button class="chip on" data-int="${esc(i)}" type="button">${esc(i)} ✕</button>`).join("")},
  async interesQ(){const q=Q.trim().toLowerCase();if(!q)return;const ints=PERFIL.intereses||[];if(!ints.includes(q))ints.push(q);PERFIL.intereses=ints;try{await DB.collection("usuarios").doc(ME.uid).update({intereses:ints});toast("Te mostraremos primero «"+q+"»")}catch(e){toast(errTxt(e))}},
  editar(){if(DET&&DET.uid===ME.uid)ir("publicar",DET)},
  async vendido(){if(!DET)return;try{await DB.collection("publicaciones").doc(DET.id).update({vendido:!DET.vendido});FEED=[];toast(DET.vendido?"Disponible otra vez":"Marcada como vendida");ir("post",DET.id)}catch(e){toast(errTxt(e))}},
  async borrar(){if(!DET)return;if(A._b!==DET.id){A._b=DET.id;toast("Toca «Borrar» otra vez para confirmar");setTimeout(()=>{A._b=null},4000);return}A._b=null;
    try{await DB.collection("fotos").doc(DET.id).delete().catch(()=>{});await DB.collection("publicaciones").doc(DET.id).delete();FEED=[];toast("Publicación borrada");ir("mias")}catch(e){toast(errTxt(e))}},
  async compartir(){if(!DET)return;const t=DET.titulo+" · "+money(DET.precio)+" en "+NOMBRE,u=location.href.split("#")[0]+"#p="+DET.id;try{if(navigator.share){await navigator.share({title:t,text:t,url:u});return}}catch(e){return}try{await navigator.clipboard.writeText(t+" "+u);toast("Enlace copiado")}catch(e){toast(u)}},
  async mLogo(){const f=await elegirFoto();if(!f)return;try{MB.logo=await achicarLogo(f);pintarMarca()}catch(e){toast(errTxt(e))}},
  mQuitar(){MB.logo="";pintarMarca()},
  async mFondoFoto(){const f=await elegirFoto();if(!f)return;try{MB.img=await achicar(f,1000,.6);MB.pat="foto";pintarMarca()}catch(e){toast(errTxt(e))}},
  mFondoQuitar(){MB.img="";MB.pat="";pintarMarca()},
  mCancelar(){aplicarMarca(MARCA);ir("admin")},
  async mGuardar(){if(!ADMIN)return;MB.nombre=($("#mnom").value||"").trim().slice(0,28)||MARCA0.nombre;$("#mgo").disabled=true;
    try{await DB.collection("config").doc("marca").set({txt:leerTxt(),nombre:MB.nombre,logo:MB.logo||"",color:MB.color,fondo:MB.fondo,acento:MB.acento||MARCA0.acento,pat:MB.pat==="foto"&&!MB.img?"":(MB.pat||""),img:MB.pat==="foto"?(MB.img||""):""});MB.txt=leerTxt();MARCA=Object.assign({},MB);try{localStorage.setItem("mercado_marca",JSON.stringify(MARCA))}catch(e){}aplicarMarca();toast("Apariencia guardada");ir("admin")}
    catch(e){toast(errTxt(e));$("#mgo").disabled=false}},
  tema(v){TEMA=v;try{localStorage.setItem("mercado_tema",v)}catch(e){}aplicarMarca(VISTA==="marca"&&MB?MB:MARCA)},
  alternarTema(){A.tema(oscuro()?"claro":"oscuro")},
  chatear(){if(DET&&DET.uid!==ME.uid){CHAT_VOLVER="post";VOLVER_POST=DET.id;abrirChat(DET)}},
  enviar(){enviarMsg()},
  atrasChat(){$("#tabs").hidden=false;CHAT_VOLVER==="post"&&VOLVER_POST?ir("post",VOLVER_POST):ir("mensajes")},
  async copiarId(){try{await navigator.clipboard.writeText(ME.uid);toast("ID copiado")}catch(e){toast(ME.uid)}},
  async adBorrar(){if(!ADMIN||!DET)return;if(A._b!=="ad"+DET.id){A._b="ad"+DET.id;toast("Toca otra vez para borrar");setTimeout(()=>{A._b=null},4000);return}A._b=null;
    try{await DB.collection("fotos").doc(DET.id).delete().catch(()=>{});await DB.collection("publicaciones").doc(DET.id).delete();FEED=[];toast("Publicación borrada");ir(VOLVER||"inicio")}catch(e){toast(errTxt(e))}},
  async adBorrarTodo(uid){if(!ADMIN)return;if(A._b!=="all"+uid){A._b="all"+uid;toast("Toca otra vez para borrar TODO");setTimeout(()=>{A._b=null},4000);return}A._b=null;
    try{const q=await DB.collection("publicaciones").where("uid","==",uid).get();await Promise.all(q.docs.map(async d=>{await DB.collection("fotos").doc(d.id).delete().catch(()=>{});await DB.collection("publicaciones").doc(d.id).delete()}));FEED=[];toast(q.docs.length+" borradas");ir("vendedor",uid)}catch(e){toast(errTxt(e))}},
  async adBloq(v){if(!ADMIN)return;const [uid,d]=v.split("|");try{const n=await bloquear(uid,+d);toast(+d?"Bloqueado "+d+(d==="1"?" día":" días")+" ("+n+" publicaciones ocultas)":"Desbloqueado");VISTA==="post"&&DET?ir("post",DET.id):ir("vendedor",uid)}catch(e){toast(errTxt(e))}},
  async adDescartar(id){try{await DB.collection("reportes").doc(id).delete();vistaAdmin()}catch(e){toast(errTxt(e))}},
  async reportar(){if(!DET)return;const r=prompt("¿Por qué reportas esta publicación?");if(!r)return;try{await DB.collection("reportes").add({post:DET.id,motivo:r.slice(0,300),por:ME.uid,creado:Date.now()});toast("Gracias, lo revisaremos")}catch(e){toast(errTxt(e))}}
};
let VOLVER="inicio",CHAT_VOLVER="mensajes",VOLVER_POST=null;
document.addEventListener("click",e=>{
  const t=e.target;let b;
  if((b=t.closest("[data-go]"))){ir(b.dataset.go);return}
  if((b=t.closest("[data-chat]"))){CHAT_VOLVER="mensajes";ir("chat",b.dataset.chat);return}
  if((b=t.closest("[data-post]"))){VOLVER=VISTA==="post"?VOLVER:VISTA;ir("post",b.dataset.post);return}
  if((b=t.closest("[data-vend]"))){ir("vendedor",b.dataset.vend);return}
  if((b=t.closest("[data-cat]"))){CAT=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x.dataset.cat===CAT));if(CAT)aprender(["cat:"+CAT]);VISTA==="buscar"?pintarBusqueda():pintarInicio();return}
  if((b=t.closest("[data-pcat]"))){BORRADOR.cat=b.dataset.pcat;document.querySelectorAll("[data-pcat]").forEach(x=>x.classList.toggle("on",x===b));return}
  if((b=t.closest("[data-quitarfoto]"))){BORRADOR.fotos.splice(+b.dataset.quitarfoto,1);pintarFotos();return}
  if((b=t.closest("[data-int]"))){const v=b.dataset.int,i=PF.ints.indexOf(v);if(i>=0)PF.ints.splice(i,1);else PF.ints.push(v);if(v.startsWith("cat:"))b.classList.toggle("on");else b.remove();return}
  if((b=t.closest("[data-mcolor]"))){MB.color=b.dataset.mcolor;$("#mcol").value=MB.color;pintarMarca();return}
  if((b=t.closest("[data-macento]"))){MB.acento=b.dataset.macento;pintarMarca();return}
  if((b=t.closest("[data-tema]"))){A.tema(b.dataset.tema);return}
  if((b=t.closest("[data-mfondo]"))){MB.fondo=b.dataset.mfondo;pintarMarca();return}
  if((b=t.closest("[data-mpat]"))){MB.pat=b.dataset.mpat;if(MB.pat==="foto"&&!MB.img){pintarMarca();A.mFondoFoto();return}pintarMarca();return}
  if((b=t.closest("[data-a]"))&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset.v)}
});
document.addEventListener("input",e=>{if(e.target.id==="mtxt"){e.target.style.height="auto";e.target.style.height=Math.min(120,e.target.scrollHeight)+"px"}
  if(e.target.id==="q"){Q=e.target.value;pintarBusqueda()}
  else if(e.target.id==="mnom"&&MB){MB.nombre=e.target.value;pintarMarca()}
  else if(e.target.id==="mcol"&&MB){MB.color=e.target.value;pintarMarca()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){if(e.target.id==="pnew"){e.preventDefault();A.addint()}else if(["mail","pw","nom"].includes(e.target.id)&&$("#go")){e.preventDefault();$("#go").click()}}});

aplicarMarca();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(TEMA==="auto")aplicarMarca(VISTA==="marca"&&MB?MB:MARCA)})}catch(e){}
iniciar();
