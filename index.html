<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercadito · Compra y vende cerca de ti</title>
<meta name="theme-color" content="#0f7a4a">
<meta name="description" content="Publica lo que vendes y encuentra lo que te interesa cerca de ti.">
<style>
:root{--brandT:#0f7a4a;--onbrand:#fff;--bg:#f5f3ee;--card:#fff;--ink:#1d2420;--mute:#6b746f;--line:#e4e1d9;--brand:#0f7a4a;--brand2:#e9f5ee;--accent:#f2a93b;--red:#c2413a;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--fondoImg,none);pointer-events:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin:auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:var(--bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--brandT);min-width:0;display:flex;align-items:center;gap:6px}
.logo i{font-style:normal;background:var(--brand);color:var(--onbrand);border-radius:9px;width:30px;height:30px;display:grid;place-items:center;font-size:17px;flex:none;overflow:hidden}
.logo i.img{background:none}.logo i.img img{width:100%;height:100%;object-fit:contain}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}.sw.on{box-shadow:0 0 0 3px var(--ink)}
.mlogo{width:84px;height:84px;border-radius:16px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-size:40px;overflow:hidden;flex:none}.mlogo img{width:100%;height:100%;object-fit:contain;background:#fff}.row>.mlogo{flex:none}
.grow{flex:1}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--brand2);display:grid;place-items:center;font-weight:700;color:var(--brandT);flex:none;overflow:hidden;border:0}
.av img{width:100%;height:100%;object-fit:cover}
.search{display:flex;gap:8px;padding-bottom:10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 16px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h2.sec{font-size:17px;margin:16px 0 10px;display:flex;align-items:baseline;gap:8px}
h2.sec small{font-weight:400;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.post{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;display:flex;flex-direction:column}
.post .ph{aspect-ratio:1;background:#ecebe6;position:relative}
.post .ph img{width:100%;height:100%;object-fit:cover;display:block}
.post .ph .tag{position:absolute;left:8px;top:8px;background:var(--accent);color:#3b2600;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
.post .ph .sold{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:1px}
.post .in{padding:9px 10px 11px}
.post .pr{font-weight:800;font-size:16px}
.post .ti{font-size:14px;line-height:1.25;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .ci{font-size:12px;color:var(--mute);margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;line-height:1.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 12px;min-width:64px}
nav.tabs button b{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brandT);font-weight:700}
nav.tabs .pub b{background:var(--brand);color:var(--onbrand);border-radius:12px;width:44px;height:32px;display:grid;place-items:center;font-size:24px}
.btn{border:0;background:var(--brand);color:var(--onbrand);border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1px solid #efc9c6}
.btn.wa{background:#1fa855;color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.in-f{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;font-size:15px}
textarea.in-f{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.err{color:var(--red);font-size:14px;margin-top:10px}
.ok{color:var(--brandT);font-size:14px;margin-top:10px}
.auth{max-width:420px;margin:30px auto;padding:0 16px}
.auth h1{font-size:28px;letter-spacing:-.5px;margin-bottom:4px}
.auth p.sub{color:var(--mute);margin-bottom:18px;line-height:1.45}
.link{background:none;border:0;color:var(--brandT);font-weight:700;padding:6px 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:12px;line-height:1.4}
.chk input{margin-top:2px;width:18px;height:18px;flex:none}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick .chip{font-size:14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{width:86px;height:86px;border-radius:10px;overflow:hidden;position:relative;background:#ecebe6}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
.photos .add{width:86px;height:86px;border-radius:10px;border:2px dashed var(--line);background:#fff;font-size:26px;color:var(--mute)}
.det .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;background:#ecebe6;border-radius:var(--r);margin-top:12px}
.det .gal img{width:100%;flex:none;aspect-ratio:1;max-height:52vh;object-fit:cover;scroll-snap-align:center}
.det h1{font-size:22px;margin-top:12px;line-height:1.25}
.det .pr{font-size:26px;font-weight:800;color:var(--brandT);margin-top:4px}
.det .meta{color:var(--mute);font-size:13px;margin-top:6px}
.det .desc{margin-top:14px;line-height:1.55;white-space:pre-wrap}
.seller{display:flex;gap:12px;align-items:center}
.seller .av{width:48px;height:48px;font-size:18px}
.seller b{display:block}
.seller small{color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.back{background:none;border:0;font-size:15px;color:var(--mute);padding:12px 0 0}
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px}
.prof h1{font-size:21px}
.prof p{color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.banner{background:#fff6e6;border:1px solid #f4dcae;color:#6b4a0e;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.4}
.legal{font-size:13px;color:var(--mute);line-height:1.55}
.legal h3{color:var(--ink);font-size:15px;margin:12px 0 4px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<nav class="tabs" id="tabs" hidden>
  <button data-go="inicio"><b>🏠</b>Inicio</button>
  <button data-go="buscar"><b>🔎</b>Buscar</button>

<div id="toast" role="status"></div>

<script>

const FIREBASE_CONFIG={
  apiKey:"AIzaSyB5vEJcbyawoKU2h4_iqG9mHaTFCmUyLcM",
  authDomain:"wifood-prototipo.firebaseapp.com",

let NOMBRE="Mercadito";

const TXTN=[["entrarT","Título al entrar",40],["entrarS","Frase al entrar",120],["regT","Título al registrarse",40],["regS","Frase al registrarse",120],["paraT","Título de recomendados",30],["recT","Título de lo más nuevo",30],["vacio","Mensaje cuando no hay publicaciones",120],["lema","Frase de la pestaña del navegador",60]];
const T=(k,m)=>{const t=((m||MARCA).txt||{})[k];return esc(t&&String(t).trim()?t:TXT0[k])};

const FONDOS=[["#f5f3ee","Crema"],["#ffffff","Blanco"],["#f1f3f5","Gris"],["#eef7f1","Menta"],["#eef4fb","Celeste"],["#fbf0f3","Rosado"]];
let MARCA=Object.assign({},MARCA0);try{Object.assign(MARCA,JSON.parse(localStorage.getItem("mercado_marca")||"{}"))}catch(e){}
const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h||"");
const h2r=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]};
const r2h=a=>"#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const mezcla=(a,b,t)=>{const x=h2r(a),y=h2r(b);return r2h(x.map((v,i)=>v+(y[i]-v)*t))};
const lum=h=>{const [r,g,b]=h2r(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
function aplicarMarca(m){
  m=m||MARCA;NOMBRE=(m.nombre||"").trim()||MARCA0.nombre;
  const c=hexOk(m.color)?m.color:MARCA0.color,f=hexOk(m.fondo)?m.fondo:MARCA0.fondo,st=document.documentElement.style;
  let t=c,k=0;while(lum(t)>.15&&k++<12)t=mezcla(t,"#000000",.15);
  st.setProperty("--brand",c);st.setProperty("--brandT",t);st.setProperty("--brand2",mezcla(c,"#ffffff",.88));
  st.setProperty("--onbrand",lum(c)>.4?"#1d2420":"#fff");st.setProperty("--bg",f);

    :m.pat==="cuadros"?`linear-gradient(${tn} 1.5px,transparent 1.5px) 0 0/26px 26px,linear-gradient(90deg,${tn} 1.5px,transparent 1.5px) 0 0/26px 26px`
    :m.pat==="rombos"?`linear-gradient(135deg,${tn} 25%,transparent 25%) -14px 0/28px 28px,linear-gradient(225deg,${tn} 25%,transparent 25%) -14px 0/28px 28px,linear-gradient(315deg,${tn} 25%,transparent 25%) 0 0/28px 28px,linear-gradient(45deg,${tn} 25%,transparent 25%) 0 0/28px 28px`:"none");
  document.body&&(document.body.style.background=m.pat?"transparent":"");document.documentElement.style.background=f;
  document.title=NOMBRE+" · "+(((m.txt||{}).lema||"").trim()||TXT0.lema);
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=c;
  let ic=document.querySelector('link[rel="icon"]');if(!ic){ic=document.createElement("link");ic.rel="icon";document.head.appendChild(ic)}
  ic.href=m.logo||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="'+c+'"/><text x="50" y="68" font-size="56" text-anchor="middle">🛒</text></svg>');
  document.querySelectorAll(".marca").forEach(e=>e.innerHTML=logoH(m)+esc(NOMBRE));
}
const logoH=m=>{m=m||MARCA;return m.logo?`<i class="img"><img src="${m.logo}" alt=""></i>`:`<i>🛒</i>`};
function cargarMarca(){
  DB.collection("config").doc("marca").get().then(d=>{
    const nueva=Object.assign({},MARCA0,d.exists?d.data():{});
    if(JSON.stringify(nueva)!==JSON.stringify(MARCA)){MARCA=nueva;try{localStorage.setItem("mercado_marca",JSON.stringify(MARCA))}catch(e){}if(VISTA!=="marca")aplicarMarca();if($(".auth .marca")&&$("#mail")&&!$("#mail").value)pantallaEntrar(MODO_ENTRAR)}
  }).catch(()=>{});
}
const CATS=[["comida","🍲","Comida"],["frutas","🥑","Frutas y verduras"],["tecno","📱","Tecnología"],["ropa","👕","Ropa y calzado"],["hogar","🛋️","Hogar"],["belleza","💄","Belleza"],["vehiculos","🛵","Vehículos"],["servicios","🛠️","Servicios"],["animales","🐾","Animales"],["otros","📦","Otros"]];
const catN=k=>(CATS.find(c=>c[0]===k)||CATS[CATS.length-1]);

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-CO");
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const STOP=new Set("de la el los las un una y o en con para por del al se vendo venta vende compro que mi mis su sus es muy bien buen buena nuevo nueva usado usada".split(" "));
const palabras=s=>[...new Set(norm(s).split(/[^a-z0-9ñ]+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.length>4&&w.endsWith("s")?w.replace(/(es|s)$/,""):w))];
const hace=t=>{const s=(Date.now()-t)/1000;if(s<60)return"ahora";if(s<3600)return"hace "+Math.floor(s/60)+" min";if(s<86400)return"hace "+Math.floor(s/3600)+" h";const d=Math.floor(s/86400);return d===1?"ayer":"hace "+d+" días"};
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}
const inicial=n=>esc((String(n||"?").trim()[0]||"?").toUpperCase());
const avatar=(foto,nom)=>foto?`<span class="av"><img src="${foto}" alt=""></span>`:`<span class="av">${inicial(nom)}</span>`;
/* foto a JPEG pequeño, para que quepa en la base de datos gratis */
function achicar(file,max,q){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",q||.75))};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("No se pudo leer la imagen"))};im.src=u})}
function elegirFoto(){return new Promise(ok=>{const f=$("#file");f.value="";f.onchange=()=>ok(f.files&&f.files[0]||null);f.click()})}
const ERR={"auth/email-already-in-use":"Ese correo ya tiene una cuenta. Inicia sesión.","auth/invalid-email":"El correo no es válido.","auth/weak-password":"La contraseña debe tener al menos 6 caracteres.","auth/wrong-password":"Correo o contraseña incorrectos.","auth/user-not-found":"Correo o contraseña incorrectos.","auth/invalid-credential":"Correo o contraseña incorrectos.","auth/invalid-login-credentials":"Correo o contraseña incorrectos.","auth/too-many-requests":"Demasiados intentos. Espera un momento.","auth/network-request-failed":"Sin internet. Revisa la conexión.","permission-denied":"No tienes permiso para eso. Revisa las reglas de Firestore."};
const errTxt=e=>ERR[e&&e.code]||(e&&e.message)||"Algo salió mal";

/* ---------- estado ---------- */
let REG=null,ADMIN=false;/* registro en curso: espera a que se cree el perfil */
let AUTH,DB,ME=null,PERFIL=null,VISTA="inicio",FEED=[],CAT="",Q="",DET=null,BORRADOR=null;

/* ---------- arranque ---------- */
function configGuardada(){try{return FIREBASE_CONFIG||JSON.parse(localStorage.getItem("mercado_cfg"))}catch(e){return FIREBASE_CONFIG}}
function cargar(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("Sin internet"));document.head.appendChild(s)})}
async function iniciar(){
  const cfg=configGuardada();
  if(!cfg){pantallaConfig();return}
  try{
    if(!window.firebase){const V="https://www.gstatic.com/firebasejs/10.12.2/";await cargar(V+"firebase-app-compat.js");await cargar(V+"firebase-auth-compat.js");await cargar(V+"firebase-firestore-compat.js")}

const bloqueado=()=>PERFIL&&(PERFIL.bloqueadoHasta||0)>Date.now();
const fecha=t=>new Date(t).toLocaleDateString("es-CO",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});

async function leerPerfil(uid){try{const d=await DB.collection("usuarios").doc(uid).get();return d.exists?d.data():null}catch(e){return null}}

/* ---------- configuración (solo la primera vez) ---------- */
function leerConfig(t){const o={};["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{const m=String(t).match(new RegExp(k+'\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]});return o.apiKey&&o.projectId&&o.appId?o:null}
function pantallaConfig(){

async function cargarFeed(){
  const q=await DB.collection("publicaciones").orderBy("creado","desc").limit(120).get();
  FEED=q.docs.map(d=>Object.assign({id:d.id},d.data())).filter(p=>ADMIN||visible(p));
  return FEED;
}
/* Puntaje de interés: lo que marcó en su perfil, lo que ha buscado y mirado, su ciudad y qué tan nueva es */
function puntaje(p){
  if(!PERFIL)return 0;
  let s=0;const w=new Set(p.palabras||[]),ints=PERFIL.intereses||[],g=PERFIL.gustos||{};
  ints.forEach(i=>{if(i.startsWith("cat:")){if(p.cat===i.slice(4))s+=4}else palabras(i).forEach(x=>{if(w.has(x))s+=6})});
  Object.keys(g).forEach(k=>{if(k.startsWith("cat:")){if(p.cat===k.slice(4))s+=Math.min(3,g[k]*.5)}else if(w.has(k))s+=Math.min(4,g[k])});
  if(PERFIL.ciudad&&norm(p.ciudad)===norm(PERFIL.ciudad))s+=2;
  const dias=(Date.now()-(p.creado||0))/864e5;s+=Math.max(0,2-dias/7);
  if(p.vendido)s-=5;if(p.uid===ME.uid)s-=3;
  return s;
}
/* Aprende de lo que busca y mira (se guarda en su perfil) */
let gustoT=null;
function aprender(cosas){
  if(!PERFIL)return;const g=PERFIL.gustos=PERFIL.gustos||{};
  cosas.forEach(k=>{g[k]=Math.min(20,(g[k]||0)+1)});
  const top=Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,60);PERFIL.gustos=Object.fromEntries(top);
  clearTimeout(gustoT);gustoT=setTimeout(()=>{DB.collection("usuarios").doc(ME.uid).update({gustos:PERFIL.gustos}).catch(()=>{})},1500);
}
function tarjeta(p,interes){

function pintarInicio(){

  $("#cont").innerHTML=h;
}

async function bloquear(uid,dias){

  FEED=[];return q.docs.length;
}

function achicarLogo(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let d=c.toDataURL("image/png");if(d.length>180000)d=c.toDataURL("image/webp",.85);if(d.length>180000||!/^data:image\/webp/.test(d)&&d.length>180000)d=c.toDataURL("image/jpeg",.8);ok(d)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("No se pudo leer la imagen"))};im.src=u})}

/* ---------- publicar / editar ---------- */

  <div class="card">

  <label class="f" for="pr">Precio (pesos)</label><input id="pr" class="in-f" type="number" inputmode="numeric" min="0" placeholder="Ej: 85000" value="${esc(BORRADOR.precio)}">

  <label class="f" for="ciu">Ciudad o pueblo</label><input id="ciu" class="in-f" maxlength="40" value="${esc(BORRADOR.ciudad)}">

  <button class="btn block" style="margin-top:16px" id="pub">${p?"Guardar cambios":"Publicar"}</button><p class="err" id="per"></p>

function pintarFotos(){
  const el=$("#fotos");if(!el||!BORRADOR)return;
  el.innerHTML=BORRADOR.fotos.map((f,i)=>`<div class="p"><img src="${f}" alt=""><button data-quitarfoto="${i}" aria-label="Quitar foto">✕</button></div>`).join("")+(BORRADOR.fotos.length<4?`<button class="add" data-a="masfoto" type="button" aria-label="Agregar foto">+</button>`:"");
}
async function publicar(){
  const b=BORRADOR,er=$("#per");er.textContent="";
  b.titulo=$("#ti").value.trim();b.precio=Math.round(+$("#pr").value||0);b.ciudad=$("#ciu").value.trim();b.desc=$("#de").value.trim();
  if(!b.fotos.length){er.textContent="Agrega al menos una foto.";return}
  if(b.titulo.length<3){er.textContent="Escribe qué vendes.";return}
  if(!b.cat){er.textContent="Elige una categoría.";return}
  $("#pub").disabled=true;
  try{
    const mini=await achicarDataURL(b.fotos[0],320,.7);
    const datos={uid:ME.uid,vNombre:PERFIL.nombre,titulo:b.titulo,precio:b.precio,cat:b.cat,ciudad:b.ciudad,desc:b.desc,mini,palabras:palabras(b.titulo+" "+b.desc+" "+catN(b.cat)[2]).slice(0,40)};
    let id=b.id;
    if(id){await DB.collection("publicaciones").doc(id).update(Object.assign(datos,{editado:Date.now()}))}
    else{datos.creado=Date.now();datos.vendido=false;const r=await DB.collection("publicaciones").add(datos);id=r.id}
    await DB.collection("fotos").doc(id).set({uid:ME.uid,imgs:b.fotos});
    FEED=[];toast(b.id?"Cambios guardados":"¡Publicado! 🎉");BORRADOR=null;ir("post",id);
  }catch(e){er.textContent=errTxt(e);$("#pub").disabled=false}
}
function achicarDataURL(src,max,q){return new Promise(ok=>{const im=new Image();setTimeout(()=>ok(src),4000);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");if(!x){ok(src);return}x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.onerror=()=>ok(src);im.src=src})}

function legal(){
  const w=document.createElement("div");w.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:grid;place-items:center;padding:16px";
  w.innerHTML=`<div class="card legal" style="max-width:520px;max-height:85vh;overflow:auto;margin:0"><h2 style="color:var(--ink)">Términos y tratamiento de datos</h2>
  <h3>Qué datos guardamos</h3><p>Tu correo, nombre, foto, ciudad, WhatsApp, tus intereses y lo que publicas. La contraseña la maneja Google Firebase y nosotros no la vemos.</p>
  <h3>Para qué</h3><p>Para que funcione tu cuenta, mostrar tus publicaciones y mostrarte primero lo que te interesa. Tu WhatsApp lo ven las personas que abren tus publicaciones, para que puedan escribirte.</p>
  <h3>Tus derechos</h3><p>Puedes ver, corregir y borrar tus datos y publicaciones cuando quieras desde tu perfil, o pedir que borremos tu cuenta (Ley 1581 de 2012).</p>
  <h3>Reglas</h3><p>Está prohibido publicar productos ilegales, robados, armas, drogas, medicamentos, animales silvestres o contenido engañoso. ${NOMBRE} solo pone en contacto a compradores y vendedores: el negocio, el pago y la entrega se acuerdan entre ustedes. Encuéntrense en lugares públicos y no paguen por adelantado a desconocidos.</p>
  <button class="btn block" style="margin-top:14px">Entendido</button></div>`;
  w.onclick=e=>{if(e.target===w||e.target.tagName==="BUTTON")w.remove()};document.body.appendChild(w);
}

/* ---------- clics ---------- */
const A={
  m_entrar(){pantallaEntrar("entrar")},m_registro(){pantallaEntrar("registro")},m_recuperar(){pantallaEntrar("recuperar")},
  legal(){legal()},
  async salir(){await AUTH.signOut();FEED=[];PERFIL=null;VISTA="inicio"},
  atras(){ir(VOLVER||"inicio")},
  async reenviar(){try{await ME.sendEmailVerification();toast("Correo enviado")}catch(e){toast(errTxt(e))}},
  noverif(){sessionStorage.setItem("noVerif","1");pintarInicio()},
  async masfoto(){const f=await elegirFoto();if(!f)return;try{BORRADOR.fotos.push(await achicar(f,900,.72));pintarFotos()}catch(e){toast(errTxt(e))}},

  addint(){const v=$("#pnew").value.trim().toLowerCase();if(!v)return;if(!PF.ints.includes(v))PF.ints.push(v);$("#pnew").value="";$("#ppal").innerHTML=PF.ints.filter(i=>!i.startsWith("cat:")).map(i=>`<button class="chip on" data-int="${esc(i)}" type="button">${esc(i)} ✕</button>`).join("")},
  async interesQ(){const q=Q.trim().toLowerCase();if(!q)return;const ints=PERFIL.intereses||[];if(!ints.includes(q))ints.push(q);PERFIL.intereses=ints;try{await DB.collection("usuarios").doc(ME.uid).update({intereses:ints});toast("Te mostraremos primero «"+q+"»")}catch(e){toast(errTxt(e))}},
  editar(){if(DET&&DET.uid===ME.uid)ir("publicar",DET)},
  async vendido(){if(!DET)return;try{await DB.collection("publicaciones").doc(DET.id).update({vendido:!DET.vendido});FEED=[];toast(DET.vendido?"Disponible otra vez":"Marcada como vendida");ir("post",DET.id)}catch(e){toast(errTxt(e))}},
  async borrar(){if(!DET)return;if(A._b!==DET.id){A._b=DET.id;toast("Toca «Borrar» otra vez para confirmar");setTimeout(()=>{A._b=null},4000);return}A._b=null;
    try{await DB.collection("fotos").doc(DET.id).delete().catch(()=>{});await DB.collection("publicaciones").doc(DET.id).delete();FEED=[];toast("Publicación borrada");ir("mias")}catch(e){toast(errTxt(e))}},
  async compartir(){if(!DET)return;const t=DET.titulo+" · "+money(DET.precio)+" en "+NOMBRE,u=location.href.split("#")[0]+"#p="+DET.id;try{if(navigator.share){await navigator.share({title:t,text:t,url:u});return}}catch(e){return}try{await navigator.clipboard.writeText(t+" "+u);toast("Enlace copiado")}catch(e){toast(u)}},
  async mLogo(){const f=await elegirFoto();if(!f)return;try{MB.logo=await achicarLogo(f);pintarMarca()}catch(e){toast(errTxt(e))}},
  mQuitar(){MB.logo="";pintarMarca()},

  mFondoQuitar(){MB.img="";MB.pat="";pintarMarca()},

    catch(e){toast(errTxt(e));$("#mgo").disabled=false}},
  async copiarId(){try{await navigator.clipboard.writeText(ME.uid);toast("ID copiado")}catch(e){toast(ME.uid)}},
  async adBorrar(){if(!ADMIN||!DET)return;if(A._b!=="ad"+DET.id){A._b="ad"+DET.id;toast("Toca otra vez para borrar");setTimeout(()=>{A._b=null},4000);return}A._b=null;
    try{await DB.collection("fotos").doc(DET.id).delete().catch(()=>{});await DB.collection("publicaciones").doc(DET.id).delete();FEED=[];toast("Publicación borrada");ir(VOLVER||"inicio")}catch(e){toast(errTxt(e))}},
  async adBorrarTodo(uid){if(!ADMIN)return;if(A._b!=="all"+uid){A._b="all"+uid;toast("Toca otra vez para borrar TODO");setTimeout(()=>{A._b=null},4000);return}A._b=null;
    try{const q=await DB.collection("publicaciones").where("uid","==",uid).get();await Promise.all(q.docs.map(async d=>{await DB.collection("fotos").doc(d.id).delete().catch(()=>{});await DB.collection("publicaciones").doc(d.id).delete()}));FEED=[];toast(q.docs.length+" borradas");ir("vendedor",uid)}catch(e){toast(errTxt(e))}},
  async adBloq(v){if(!ADMIN)return;const [uid,d]=v.split("|");try{const n=await bloquear(uid,+d);toast(+d?"Bloqueado "+d+(d==="1"?" día":" días")+" ("+n+" publicaciones ocultas)":"Desbloqueado");VISTA==="post"&&DET?ir("post",DET.id):ir("vendedor",uid)}catch(e){toast(errTxt(e))}},

};
let VOLVER="inicio";
document.addEventListener("click",e=>{
  const t=e.target;let b;
  if((b=t.closest("[data-go]"))){ir(b.dataset.go);return}
  if((b=t.closest("[data-post]"))){VOLVER=VISTA==="post"?VOLVER:VISTA;ir("post",b.dataset.post);return}
  if((b=t.closest("[data-vend]"))){ir("vendedor",b.dataset.vend);return}
  if((b=t.closest("[data-cat]"))){CAT=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x.dataset.cat===CAT));if(CAT)aprender(["cat:"+CAT]);VISTA==="buscar"?pintarBusqueda():pintarInicio();return}
  if((b=t.closest("[data-pcat]"))){BORRADOR.cat=b.dataset.pcat;document.querySelectorAll("[data-pcat]").forEach(x=>x.classList.toggle("on",x===b));return}
  if((b=t.closest("[data-quitarfoto]"))){BORRADOR.fotos.splice(+b.dataset.quitarfoto,1);pintarFotos();return}
  if((b=t.closest("[data-int]"))){const v=b.dataset.int,i=PF.ints.indexOf(v);if(i>=0)PF.ints.splice(i,1);else PF.ints.push(v);if(v.startsWith("cat:"))b.classList.toggle("on");else b.remove();return}
  if((b=t.closest("[data-mcolor]"))){MB.color=b.dataset.mcolor;$("#mcol").value=MB.color;pintarMarca();return}
  if((b=t.closest("[data-mfondo]"))){MB.fondo=b.dataset.mfondo;pintarMarca();return}
  if((b=t.closest("[data-mpat]"))){MB.pat=b.dataset.mpat;if(MB.pat==="foto"&&!MB.img){pintarMarca();A.mFondoFoto();return}pintarMarca();return}
  if((b=t.closest("[data-a]"))&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset.v)}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){Q=e.target.value;pintarBusqueda()}
  else if(e.target.id==="mnom"&&MB){MB.nombre=e.target.value;pintarMarca()}
  else if(e.target.id==="mcol"&&MB){MB.color=e.target.value;pintarMarca()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){if(e.target.id==="pnew"){e.preventDefault();A.addint()}else if(["mail","pw","nom"].includes(e.target.id)&&$("#go")){e.preventDefault();$("#go").click()}}});

window.addEventListener("hashchange",()=>{const m=location.hash.match(/p=([\w-]+)/);if(m&&ME&&PERFIL)ir("post",m[1])});
const _ini=location.hash.match(/p=([\w-]+)/);if(_ini){VISTA="post";const id=_ini[1];const old=ir;ir=function(v,a){ir=old;old(v==="post"&&!a?"post":v,v==="post"&&!a?id:a)}}
aplicarMarca();
iniciar();
